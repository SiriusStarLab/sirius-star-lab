kind = "web"
previewPath = "/new-dimensions/"
title = "New Dimensions — CAD SaaS"
version = "1.0.0"
id = "artifacts/new-dimensions"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/new-dimensions/" ]
localPort = 26006

[services.development]
run = "pnpm --filter @workspace/new-dimensions run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/new-dimensions", "run", "build" ]
publicDir = "artifacts/new-dimensions/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26006"
BASE_PATH = "/new-dimensions/"
