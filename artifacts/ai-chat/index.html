    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Sirius Star Lab",
      "url": "https://sirius-ai.live",
      "description": "A voice-first personal AI intelligence partnership. Ask questions, generate ideas, build products and explore possibilities with Sirius — your dedicated AI partner.",
      "applicationCategory": "ArtificialIntelligenceApplication",
      "operatingSystem": "Web, iOS, Android",
      "offers": [
        {
          "@type": "Offer",
          "name": "Free",
          "price": "0",
          "priceCurrency": "GBP",
          "description": "10 messages per day, free forever"
        },
        {
          "@type": "Offer",
          "name": "Plus",
          "price": "5",
          "priceCurrency": "GBP",
          "billingIncrement": "P1M",
          "description": "Unlimited messages, voice, and full access"
        }
      ],
      "publisher": {
        "@type": "Organization",
        "name": "Sirius Star Lab",
        "url": "https://sirius-ai.live"
      },
      "keywords": "AI assistant, personal AI, voice AI, AI partner, artificial intelligence, productivity AI, smart assistant"
    }
    </script>

    <!-- System fonts used natively — no download needed -->
    <!-- Space Mono used for code/mono blocks only -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      #sirius-splash{position:fixed;inset:0;background:#080c1a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s ease}
      #sirius-splash.fade{opacity:0;pointer-events:none}
      .s-orb{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6ee7f7,#3b6bff 55%,#0a0e2a);box-shadow:0 0 40px #3b6bff88;animation:pulse 2s ease-in-out infinite}
      @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 40px #3b6bff88}50%{transform:scale(1.06);box-shadow:0 0 60px #3b6fffbb}}
      .s-dots{display:flex;gap:8px;margin-top:24px}
      .s-dots span{width:7px;height:7px;border-radius:50%;background:#3b6bff;animation:bounce 1.2s ease-in-out infinite}
      .s-dots span:nth-child(2){animation-delay:.2s}
      .s-dots span:nth-child(3){animation-delay:.4s}
      @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-8px);opacity:1}}
    </style>
  </head>
  <body>
    <div id="sirius-splash" aria-hidden="true">
      <div class="s-orb"></div>
      <div class="s-dots"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script>
      // Fade out the splash once React has rendered at least one child into #root
      (function(){
        var splash=document.getElementById('sirius-splash');
        if(!splash)return;
        var t=setInterval(function(){
          if(document.getElementById('root').firstChild){
            clearInterval(t);
            splash.classList.add('fade');
            setTimeout(function(){splash.remove()},450);
          }
        },40);
        // Safety: remove after 6s regardless
        setTimeout(function(){clearInterval(t);if(splash)splash.remove()},6000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
