    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Sirius Star Lab",
      "url": "https://sirius-ai.live",
      "description": "A voice-first personal AI intelligence partnership. Ask questions, generate ideas, build products and explore possibilities with Sirius — your dedicated AI partner.",
      "applicationCategory": "ArtificialIntelligenceApplication",
      "operatingSystem": "Web, iOS, Android",
      "offers": [
        {
          "@type": "Offer",
          "name": "Free",
          "price": "0",
          "priceCurrency": "GBP",
          "description": "30 messages per day, free forever"
        },
        {
          "@type": "Offer",
          "name": "Sirius Plus",
          "price": "6.99",
          "priceCurrency": "GBP",
          "billingIncrement": "P1M",
          "description": "200 messages per day, voice input and output, image analysis, full conversation history"
        },
        {
          "@type": "Offer",
          "name": "Sirius Pro",
          "price": "14.99",
          "priceCurrency": "GBP",
          "billingIncrement": "P1M",
          "description": "Unlimited messages, everything in Plus, Star Lab advanced tools, priority AI models"
        }
      ],
      "publisher": {
        "@type": "Organization",
        "name": "Sirius Star Lab",
        "url": "https://sirius-ai.live"
      },
      "keywords": "AI assistant, personal AI, voice AI, AI partner, artificial intelligence, productivity AI, smart assistant"
    }
    </script>

    <!-- Clear stale SW caches on new deploys — NO page reload (reload breaks iOS PWA Add to Home Screen) -->
    <script>
      (function() {
        var V = 'sirius_bundle_v2';
        if (!localStorage.getItem(V)) {
          localStorage.setItem(V, '1');
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            });
          }
        }
      })();
    </script>

    <!-- System fonts used natively — no download needed -->
    <!-- Space Mono used for code/mono blocks only -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
