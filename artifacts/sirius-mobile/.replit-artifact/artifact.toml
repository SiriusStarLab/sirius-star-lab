kind = "mobile"
previewPath = "/sirius-mobile/"
title = "Sirius Star Lab — Mobile"
version = "1.0.0"
id = "artifacts/sirius-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
localPort = 21159
name = "expo"
paths = ["/sirius-mobile/"]

[services.development]
run = "pnpm --filter @workspace/sirius-mobile run dev"

[services.env]
PORT = "21159"
BASE_PATH = "/sirius-mobile/"

[services.production]
build = ["pnpm", "--filter", "@workspace/sirius-mobile", "run", "build"]
run = ["pnpm", "--filter", "@workspace/sirius-mobile", "run", "serve"]
