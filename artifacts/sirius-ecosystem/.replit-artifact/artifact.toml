kind = "web"
previewPath = "/sirius-ecosystem/"
title = "Sirius Ecosystem — Infographic & Brochure"
description = "A futuristic interactive infographic showing all Sirius products orbiting Star Lab as a central AI hub, plus a full sales brochure with product descriptions and the conscious business model."
version = "1.0.0"
id = "artifacts/sirius-ecosystem"
router = "path"

[[services]]
name = "web"
paths = [ "/sirius-ecosystem/" ]
localPort = 25283

[services.development]
run = "pnpm --filter @workspace/sirius-ecosystem run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sirius-ecosystem", "run", "build" ]
serve = "static"
publicDir = "artifacts/sirius-ecosystem/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25283"
BASE_PATH = "/sirius-ecosystem/"
