kind = "video"
previewPath = "/sirius-promo/"
title = "Sirius Star Lab — TikTok Promo"
version = "1.0.0"
id = "artifacts/sirius-promo"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/sirius-promo/" ]
localPort = 21692

[services.development]
run = "pnpm --filter @workspace/sirius-promo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sirius-promo", "run", "build" ]
publicDir = "artifacts/sirius-promo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21692"
BASE_PATH = "/sirius-promo/"
