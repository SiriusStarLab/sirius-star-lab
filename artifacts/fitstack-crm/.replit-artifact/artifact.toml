kind = "web"
previewPath = "/fitstack-crm/"
title = "FitStack CRM"
version = "1.0.0"
id = "artifacts/fitstack-crm"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/fitstack-crm/" ]
localPort = 26045

[services.development]
run = "pnpm --filter @workspace/fitstack-crm run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fitstack-crm", "run", "build" ]
publicDir = "artifacts/fitstack-crm/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26045"
BASE_PATH = "/fitstack-crm/"
